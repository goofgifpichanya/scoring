<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงคะแนนประเมินผลการอบรม (Scoring System)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & React-DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(147, 51, 234, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
    }
    .glass-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Constants
    const EVALUATION_CATEGORIES = [
      { id: 'data_quality', title: 'ข้อมูลและคุณภาพ', titleEn: 'Data & Quality', maxScore: 15, color: 'from-blue-500 to-cyan-500', icon: 'database' },
      { id: 'analysis_insight', title: 'Analysis & Insight', titleEn: 'Analysis & Insight', maxScore: 20, color: 'from-purple-500 to-indigo-500', icon: 'brain' },
      { id: 'report_dashboard', title: 'Report / Dashboard', titleEn: 'Report / Dashboard', maxScore: 20, color: 'from-emerald-500 to-teal-500', icon: 'layout' },
      { id: 'power_bi', title: 'Power BI', titleEn: 'Power BI Technical', maxScore: 15, color: 'from-amber-500 to-orange-500', icon: 'bar-chart-3' },
      { id: 'presentation', title: 'Presentation', titleEn: 'Presentation & Storytelling', maxScore: 15, color: 'from-rose-500 to-pink-500', icon: 'mic' },
      { id: 'creativity_practical', title: 'Creativity & Practical Use', titleEn: 'Creativity & Value', maxScore: 15, color: 'from-violet-500 to-fuchsia-500', icon: 'sparkles' }
    ];

    const TOTAL_MAX_SCORE = 100;

    const COHORTS = [
      {
        id: 'cohort_1',
        name: 'รุ่นที่ 1',
        teamCount: 16,
        teams: ['บส.', 'สป.', 'ลอ.', 'ตส.', 'สง.', 'อส.', 'พล.', 'จท.', 'ตท.', 'สบ.', 'ธญ.', 'นร.', 'บน1.', 'บน2.', 'พธ.', 'สส.']
      },
      {
        id: 'cohort_2',
        name: 'รุ่นที่ 2',
        teamCount: 15,
        teams: ['กค.', 'บช.', 'บอ.', 'งฝ.', 'บง.', 'ทน.', 'อก.', 'สว.', 'กก.', 'รส.', 'ผท.', 'งส.', 'ธต.', 'LPS', 'ธง.']
      }
    ];

    const STORAGE_KEY = 'scoring_system_standalone_v1';

    const getEvaluations = () => {
      try {
        const str = localStorage.getItem(STORAGE_KEY);
        const data = str ? JSON.parse(str) : [];
        return Array.isArray(data) ? data : [];
      } catch (e) {
        return [];
      }
    };

    const saveEvaluation = (record) => {
      const list = getEvaluations();
      const recordId = `eval_${record.cohortId}_${record.teamCode}_${record.judgeName.trim()}`;
      const newRecord = { ...record, id: recordId, timestamp: new Date().toISOString() };
      const idx = list.findIndex(item => item.id === recordId);
      if (idx >= 0) list[idx] = newRecord;
      else list.push(newRecord);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return newRecord;
    };

    function App() {
      const [activeTab, setActiveTab] = useState('judge'); // 'judge' | 'admin'
      const [selectedCohortId, setSelectedCohortId] = useState('cohort_1');
      const [selectedTeamCode, setSelectedTeamCode] = useState('บส.');
      const [judgeName, setJudgeName] = useState('กรรมการ 1');
      const [scores, setScores] = useState({ data_quality: '', analysis_insight: '', report_dashboard: '', power_bi: '', presentation: '', creativity_practical: '' });
      const [comment, setComment] = useState('');
      const [isReviewOpen, setIsReviewOpen] = useState(false);
      const [evaluatedMap, setEvaluatedMap] = useState({});
      const [evaluations, setEvaluations] = useState([]);

      const currentCohort = COHORTS.find(c => c.id === selectedCohortId) || COHORTS[0];

      const refreshData = () => {
        const evs = getEvaluations();
        setEvaluations(evs);
        const map = {};
        evs.forEach(item => {
          if (item.judgeName === judgeName && item.cohortId === selectedCohortId) {
            map[item.teamCode] = true;
          }
        });
        setEvaluatedMap(map);
      };

      useEffect(() => {
        refreshData();
      }, [selectedCohortId, judgeName, activeTab]);

      useEffect(() => {
        const evs = getEvaluations();
        const existing = evs.find(item => item.cohortId === selectedCohortId && item.teamCode === selectedTeamCode && item.judgeName === judgeName);
        if (existing) {
          setScores(existing.scores || {});
          setComment(existing.comment || '');
        } else {
          setScores({ data_quality: '', analysis_insight: '', report_dashboard: '', power_bi: '', presentation: '', creativity_practical: '' });
          setComment('');
        }
      }, [selectedTeamCode, selectedCohortId, judgeName]);

      useEffect(() => {
        setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 100);
      }, [activeTab, selectedCohortId, selectedTeamCode, isReviewOpen]);

      const handleScoreChange = (catId, val) => {
        setScores(prev => ({ ...prev, [catId]: val }));
      };

      const totalScore = Object.values(scores).reduce((sum, val) => {
        const n = parseFloat(val);
        return sum + (isNaN(n) ? 0 : n);
      }, 0);

      const roundedTotal = Math.round(totalScore * 10) / 10;

      const handleOpenReview = () => {
        for (let cat of EVALUATION_CATEGORIES) {
          const val = scores[cat.id];
          if (val === '' || val === undefined) {
            alert(`โปรดกรอกคะแนนในหมวด ${cat.title}`);
            return;
          }
          const num = Number(val);
          if (isNaN(num) || num < 0 || num > cat.maxScore) {
            alert(`คะแนนหมวด ${cat.title} ต้องอยู่ระหว่าง 0 - ${cat.maxScore} คะแนน`);
            return;
          }
        }
        setIsReviewOpen(true);
      };

      const handleConfirmSubmit = () => {
        saveEvaluation({
          cohortId: selectedCohortId,
          teamCode: selectedTeamCode,
          judgeName,
          scores,
          totalScore: roundedTotal,
          comment
        });
        setIsReviewOpen(false);
        if (window.confetti) confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        refreshData();
        alert(`บันทึกคะแนนทีม ${selectedTeamCode} เรียบร้อยแล้ว!`);
      };

      const seedDemo = () => {
        if (!confirm('ต้องการสร้างข้อมูลคะแนนจำลองทดสอบใช่หรือไม่?')) return;
        const judges = ['กรรมการ 1', 'กรรมการ 2', 'กรรมการ 3'];
        const list = [];
        COHORTS.forEach(c => {
          c.teams.forEach(t => {
            judges.forEach(j => {
              const sc = {};
              let tot = 0;
              EVALUATION_CATEGORIES.forEach(cat => {
                const ratio = 0.7 + Math.random() * 0.25;
                sc[cat.id] = Math.round(ratio * cat.maxScore * 10) / 10;
                tot += sc[cat.id];
              });
              list.push({
                id: `eval_${c.id}_${t}_${j}`,
                cohortId: c.id,
                teamCode: t,
                judgeName: j,
                scores: sc,
                totalScore: Math.round(tot * 10) / 10,
                comment: 'ผลงานทำได้สวยงามและครบถ้วนมาก',
                timestamp: new Date().toISOString()
              });
            });
          });
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        refreshData();
      };

      // Leaderboard Calculation
      const calculateLeaderboard = (cohortFilter) => {
        const statsMap = {};
        const targetCohorts = cohortFilter === 'all' ? COHORTS : COHORTS.filter(c => c.id === cohortFilter);
        
        targetCohorts.forEach(c => {
          c.teams.forEach(t => {
            const key = `${c.id}_${t}`;
            statsMap[key] = { cohortName: c.name, teamCode: t, count: 0, sum: 0, avg: 0, categorySums: {}, categoryAvgs: {} };
            EVALUATION_CATEGORIES.forEach(cat => statsMap[key].categorySums[cat.id] = 0);
          });
        });

        evaluations.forEach(item => {
          const key = `${item.cohortId}_${item.teamCode}`;
          if (statsMap[key]) {
            statsMap[key].count += 1;
            statsMap[key].sum += item.totalScore;
            EVALUATION_CATEGORIES.forEach(cat => {
              statsMap[key].categorySums[cat.id] += (item.scores?.[cat.id] || 0);
            });
          }
        });

        const list = Object.values(statsMap).map(s => {
          if (s.count > 0) {
            s.avg = Math.round((s.sum / s.count) * 10) / 10;
            EVALUATION_CATEGORIES.forEach(cat => {
              s.categoryAvgs[cat.id] = Math.round((s.categorySums[cat.id] / s.count) * 10) / 10;
            });
          }
          return s;
        });

        list.sort((a, b) => b.avg - a.avg);
        let rank = 1;
        list.forEach((s, idx) => {
          if (idx > 0 && s.avg < list[idx - 1].avg) rank = idx + 1;
          s.rank = s.count > 0 ? rank : '-';
        });
        return list;
      };

      const [adminCohortFilter, setAdminCohortFilter] = useState('all');
      const leaderboard = calculateLeaderboard(adminCohortFilter);

      return (
        <div className="min-h-screen pb-12">
          {/* Navbar */}
          <header className="sticky top-0 z-40 glass-panel border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center font-bold text-white text-xl">🏆</div>
                <div>
                  <h1 className="font-extrabold text-lg text-white">SCORING SYSTEM</h1>
                  <p className="text-xs text-slate-400">ระบบประเมินและสรุปผลคะแนน 2 รุ่นอบรม (31 ทีม)</p>
                </div>
              </div>

              <div className="flex gap-2 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                <button 
                  onClick={() => setActiveTab('judge')}
                  className={`px-4 py-2 rounded-xl text-xs font-semibold transition-all ${activeTab === 'judge' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  📝 หน้ากรรมการลงคะแนน
                </button>
                <button 
                  onClick={() => setActiveTab('admin')}
                  className={`px-4 py-2 rounded-xl text-xs font-semibold transition-all ${activeTab === 'admin' ? 'bg-purple-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  📊 หลังบ้าน / Admin Dashboard
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'judge' ? (
              <div className="space-y-8">
                {/* Header card */}
                <div className="glass-panel rounded-3xl p-6 border border-slate-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div>
                    <span className="text-xs font-semibold text-blue-400 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20">
                      แบบประเมินกรรมการ (Judge Evaluation)
                    </span>
                    <h2 className="text-2xl font-bold text-white mt-2">กรอกคะแนนและประเมินผลงาน</h2>
                  </div>

                  <div className="glass-card p-3 rounded-xl border border-slate-700">
                    <label className="text-xs text-slate-300 font-semibold block mb-1">กรรมการผู้ประเมิน:</label>
                    <select 
                      value={judgeName} 
                      onChange={e => setJudgeName(e.target.value)}
                      className="bg-slate-900 text-white text-sm font-semibold py-1.5 px-3 rounded-lg border border-slate-700"
                    >
                      <option value="กรรมการ 1">กรรมการ 1</option>
                      <option value="กรรมการ 2">กรรมการ 2</option>
                      <option value="กรรมการ 3">กรรมการ 3</option>
                      <option value="กรรมการ 4">กรรมการ 4</option>
                      <option value="กรรมการ 5">กรรมการ 5</option>
                    </select>
                  </div>
                </div>

                {/* Cohort & Teams */}
                <div className="space-y-4">
                  <div className="flex gap-2">
                    {COHORTS.map(c => (
                      <button
                        key={c.id}
                        onClick={() => { setSelectedCohortId(c.id); setSelectedTeamCode(c.teams[0]); }}
                        className={`px-6 py-2.5 rounded-xl font-bold text-sm transition-all ${selectedCohortId === c.id ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg' : 'bg-slate-900 text-slate-400 hover:text-white'}`}
                      >
                        {c.name} ({c.teamCount} ทีม)
                      </button>
                    ))}
                  </div>

                  {/* Team Grid */}
                  <div className="glass-panel p-5 rounded-2xl border border-slate-800 space-y-2">
                    <p className="text-xs font-semibold text-slate-400">เลือกทีมที่ต้องการประเมิน ({currentCohort.name}):</p>
                    <div className="grid grid-cols-4 sm:grid-cols-8 gap-2">
                      {currentCohort.teams.map(tCode => {
                        const isSelected = selectedTeamCode === tCode;
                        const isDone = evaluatedMap[tCode];
                        return (
                          <button
                            key={tCode}
                            onClick={() => setSelectedTeamCode(tCode)}
                            className={`py-2.5 px-2 rounded-xl text-center font-bold text-xs transition-all relative border ${isSelected ? 'bg-amber-500/20 border-amber-400 text-amber-300 scale-105' : isDone ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-600'}`}
                          >
                            {tCode} {isDone && '✓'}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* Banner */}
                <div className="p-5 rounded-2xl glass-card border border-blue-500/30 flex justify-between items-center">
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-2xl bg-amber-500 text-slate-950 font-black text-xl flex items-center justify-center">
                      {selectedTeamCode}
                    </div>
                    <div>
                      <p className="text-xs text-slate-400">กำลังประเมินทีม:</p>
                      <p className="text-lg font-bold text-white">ทีม {selectedTeamCode} ({currentCohort.name})</p>
                    </div>
                  </div>

                  <div className="text-right">
                    <p className="text-xs text-slate-400">คะแนนรวมปัจจุบัน:</p>
                    <p className="text-3xl font-extrabold text-amber-300">{roundedTotal} <span className="text-xs text-slate-400 font-normal">/ 100</span></p>
                  </div>
                </div>

                {/* 6 Category Cards */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {EVALUATION_CATEGORIES.map(cat => {
                    const val = scores[cat.id] ?? '';
                    const numVal = val === '' ? '' : Number(val);
                    const isExceeded = numVal !== '' && numVal > cat.maxScore;
                    return (
                      <div key={cat.id} className={`glass-card p-5 rounded-2xl border ${isExceeded ? 'border-red-500 bg-red-950/20' : 'border-slate-800'}`}>
                        <div className="flex justify-between items-center mb-2">
                          <h3 className="font-semibold text-sm text-white">{cat.title}</h3>
                          <span className="text-xs bg-slate-800 px-2 py-0.5 rounded text-amber-400 font-bold">เต็ม {cat.maxScore}</span>
                        </div>
                        <input 
                          type="number"
                          step="0.5"
                          min="0"
                          max={cat.maxScore}
                          value={val}
                          onChange={e => handleScoreChange(cat.id, e.target.value)}
                          placeholder={`0 - ${cat.maxScore}`}
                          className={`w-full text-center text-lg font-bold py-2 rounded-xl glass-input ${isExceeded ? 'border-red-500 text-red-400' : ''}`}
                        />
                        {isExceeded && <p className="text-xs text-red-400 font-semibold mt-1">⚠️ กรอกเกินคะแนนเต็ม ({cat.maxScore})</p>}
                      </div>
                    );
                  })}
                </div>

                {/* Comment */}
                <div className="glass-card p-5 rounded-2xl border border-slate-800">
                  <label className="text-sm font-semibold text-slate-200 block mb-2">ความคิดเห็นกรรมการเพิ่มเติม:</label>
                  <textarea 
                    rows="3"
                    value={comment}
                    onChange={e => setComment(e.target.value)}
                    placeholder="ระบุข้อเสนอแนะเพิ่มเติมสำหรับทีมนี้..."
                    className="w-full text-sm p-3 rounded-xl glass-input"
                  ></textarea>
                </div>

                {/* Submit button */}
                <div className="flex justify-end pt-4">
                  <button 
                    onClick={handleOpenReview}
                    className="px-8 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 font-bold text-white text-base shadow-xl"
                  >
                    ตรวจสอบและบันทึกคะแนน
                  </button>
                </div>
              </div>
            ) : (
              /* Admin Dashboard */
              <div className="space-y-8">
                <div className="glass-panel p-6 rounded-3xl border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div>
                    <span className="text-xs font-semibold text-purple-400 bg-purple-500/10 px-3 py-1 rounded-full border border-purple-500/20">หลังบ้าน / Admin Dashboard</span>
                    <h2 className="text-2xl font-bold text-white mt-1">สรุปอันดับคะแนนและรายงาน</h2>
                  </div>

                  <div className="flex gap-2">
                    <button onClick={seedDemo} className="px-4 py-2 rounded-xl bg-purple-600/30 text-purple-200 border border-purple-500/40 text-xs font-semibold">
                      ⚡ สร้างข้อมูลจำลอง (Demo Data)
                    </button>
                    <button onClick={() => { localStorage.removeItem(STORAGE_KEY); refreshData(); }} className="px-4 py-2 rounded-xl bg-rose-950/40 text-rose-300 border border-rose-800/40 text-xs font-semibold">
                      🗑️ รีเซ็ตคะแนน
                    </button>
                  </div>
                </div>

                {/* Cohort Tabs for Admin */}
                <div className="flex gap-2">
                  <button onClick={() => setAdminCohortFilter('all')} className={`px-4 py-2 rounded-xl text-xs font-semibold ${adminCohortFilter === 'all' ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400'}`}>
                    รวมทุกรุ่น (31 ทีม)
                  </button>
                  {COHORTS.map(c => (
                    <button key={c.id} onClick={() => setAdminCohortFilter(c.id)} className={`px-4 py-2 rounded-xl text-xs font-semibold ${adminCohortFilter === c.id ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400'}`}>
                      {c.name} ({c.teamCount} ทีม)
                    </button>
                  ))}
                </div>

                {/* Leaderboard Table */}
                <div className="glass-panel rounded-2xl border border-slate-800 overflow-x-auto">
                  <table className="w-full text-left border-collapse text-sm">
                    <thead>
                      <tr className="border-b border-slate-800 bg-slate-900/90 text-slate-400 text-xs uppercase">
                        <th className="py-3 px-4 text-center">อันดับ</th>
                        <th className="py-3 px-4">รุ่น</th>
                        <th className="py-3 px-4">ทีม</th>
                        <th className="py-3 px-4 text-center">คะแนนเฉลี่ยรวม (100)</th>
                        <th className="py-3 px-4 text-center">กรรมการ</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800 text-slate-200">
                      {leaderboard.map((item) => (
                        <tr key={`${item.cohortName}_${item.teamCode}`} className="hover:bg-slate-800/40">
                          <td className="py-3 px-4 text-center font-bold">
                            {item.rank === 1 ? '🥇 อันดับ 1' : item.rank === 2 ? '🥈 อันดับ 2' : item.rank === 3 ? '🥉 อันดับ 3' : `#${item.rank}`}
                          </td>
                          <td className="py-3 px-4 text-xs text-slate-400">{item.cohortName}</td>
                          <td className="py-3 px-4 font-bold text-amber-300">{item.teamCode}</td>
                          <td className="py-3 px-4 text-center font-extrabold text-blue-400 text-base">{item.count > 0 ? item.avg : '-'}</td>
                          <td className="py-3 px-4 text-center text-xs text-slate-400">{item.count} คน</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* Modal */}
            {isReviewOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <div className="glass-panel w-full max-w-lg rounded-2xl p-6 border border-slate-700 space-y-4">
                  <h3 className="text-xl font-bold text-white">สรุปก่อนบันทึกคะแนน</h3>
                  <div className="p-3 bg-slate-900 rounded-xl space-y-1 text-sm">
                    <p>กรรมการ: <span className="font-semibold text-blue-400">{judgeName}</span></p>
                    <p>รุ่น: <span className="font-semibold text-slate-200">{currentCohort.name}</span></p>
                    <p>ทีม: <span className="font-bold text-amber-300">{selectedTeamCode}</span></p>
                    <p className="text-lg font-extrabold text-emerald-400 pt-2 border-t border-slate-800">คะแนนรวมสุทธิ: {roundedTotal} / 100</p>
                  </div>
                  <div className="flex justify-end gap-3 pt-2">
                    <button onClick={() => setIsReviewOpen(false)} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm">กลับไปแก้ไข</button>
                    <button onClick={handleConfirmSubmit} className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm">ยืนยันบันทึกคะแนน</button>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
