    function initFirebase() {
      if (db) return;
      if (typeof firebase !== 'undefined' && firebase.initializeApp) {
        try {
          firebase.initializeApp(firebaseConfig);
          db = firebase.database();
          console.log("Firebase Realtime Database initialized successfully");

          db.ref("evaluations").on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
              firebaseEvaluations = Object.values(data).map(r => ({
                ...r,
                total: parseFloat(r.total) || 0,
                scores: Object.fromEntries(Object.entries(r.scores || {}).map(([k, v]) => [k, parseFloat(v) || 0]))
              }));
            } else {
              firebaseEvaluations = [];
            }
            firebaseLoaded = true;
            if (typeof render === 'function') render();
          }, (err) => {
            console.error("Firebase read error:", err);
            if (typeof showToast === 'function') {
              showToast(`⚠️ ติดปัญหาอ่านข้อมูลจาก Firebase: ${err.message}<br><small>โปรดตั้งค่า Database Rules ใน Firebase Console ให้เปิด .read: true, .write: true</small>`, 7000);
            }
          });
        } catch (e) {
          console.warn("Firebase init error:", e);
        }
      }
    }

    // Init triggers for fast & slow CDN network loads
    initFirebase();
    window.addEventListener('load', initFirebase);
    document.addEventListener('DOMContentLoaded', initFirebase);

    let initCheckCount = 0;
    const initInterval = setInterval(() => {
      initCheckCount++;
      if (db || initCheckCount > 30) {
        clearInterval(initInterval);
      } else {

      }
    }, 100);

    function sanitizeFirebaseKey(str) {
      return String(str || '').replace(/[\.\#\$\/\[\]]/g, '_');
    }

    function getAll() {
      if (firebaseLoaded && db && Array.isArray(firebaseEvaluations)) {
        return firebaseEvaluations;
      }
      try {
        const raw = localStorage.getItem(SK);
        const d = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(d)) return Array.isArray(firebaseEvaluations) ? firebaseEvaluations : [];
        return d.map(r => {
          const sc = {};
          if (r && r.scores) {
            Object.keys(r.scores).forEach(k => {
              sc[k] = parseFloat(r.scores[k]) || 0;
            });
          }
          return {
            ...r,
            total: parseFloat(r?.total) || 0,
            scores: sc
          };
        });
      } catch { return Array.isArray(firebaseEvaluations) ? firebaseEvaluations : []; }
    }

    function saveRec(r) {
      try {
        const cleanScores = {};
        if (r && r.scores) {
          Object.keys(r.scores).forEach(k => {
            cleanScores[k] = parseFloat(r.scores[k]) || 0;
          });
        }
        const cleanTotal = parseFloat(r?.total) || 0;
        const safeCohort = (r?.cohortId || 'c1').toString().trim();
        const safeTeam = (r?.teamCode || 'team').toString().trim();
        const safeJudge = (r?.judge || 'judge').toString().trim();
        const rawId = `${safeCohort}__${safeTeam}__${safeJudge}`;
        const fbKey = sanitizeFirebaseKey(rawId);

        const rec = {
          ...r,
          cohortId: safeCohort,
          teamCode: safeTeam,
          judge: safeJudge,
          scores: cleanScores,
          total: cleanTotal,
          id: rawId,
          fbKey,
          savedAt: new Date().toISOString()
        };

        // Ensure firebaseEvaluations is an array
        if (!Array.isArray(firebaseEvaluations)) {
          firebaseEvaluations = [];
        }

        // Optimistic update to in-memory array immediately
        const idx = firebaseEvaluations.findIndex(x => x && (x.id === rawId || x.fbKey === fbKey));
        if (idx >= 0) firebaseEvaluations[idx] = rec;
        else firebaseEvaluations.push(rec);

        // Save to Firebase Realtime Database using sanitized key (no dots, slashes, or forbidden chars)
        if (db) {
          try {
            db.ref("evaluations/" + fbKey).set(rec).then(() => {
              console.log("Saved to Firebase successfully:", fbKey);
            }).catch(err => {
              console.warn("Firebase write background warning (Check Rules):", err);
            });
          } catch (err) {
            console.warn("Firebase sync background exception:", err);
          }
        }

        // Backup to localStorage
        try {
          const raw = localStorage.getItem(SK);
          const d = raw ? JSON.parse(raw) : [];
          if (Array.isArray(d)) {
            const i = d.findIndex(x => x && (x.id === rawId || x.fbKey === fbKey));
            if (i >= 0) d[i] = rec; else d.push(rec);
            localStorage.setItem(SK, JSON.stringify(d));
          } else {
            localStorage.setItem(SK, JSON.stringify([rec]));
          }
        } catch (e) {
          console.warn("localStorage backup error:", e);
        }
      } catch (err) {
        console.error("saveRec internal error:", err);
        throw err;
      }
    }

    function buildBoard(cohortFilter) {
      const all = getAll();
      const cohorts = cohortFilter === 'all' ? COHORTS : COHORTS.filter(c => c.id === cohortFilter);
      const map = {};
      cohorts.forEach(c => c.teams.forEach(t => {
        const k = c.id + '_' + t;
        map[k] = { cohort: c.name, team: t, count: 0, sum: 0, catSums: {} };
        CATEGORIES.forEach(cat => map[k].catSums[cat.id] = 0);
      }));
      all.forEach(r => {
        const k = r.cohortId + '_' + r.teamCode;
        if (!map[k]) return;
        map[k].count++; map[k].sum += (r.total || 0);
        CATEGORIES.forEach(cat => map[k].catSums[cat.id] += (r.scores?.[cat.id] || 0));
      });
      const list = Object.values(map).map(m => {
        m.avg = m.count > 0 ? Math.round(m.sum / m.count * 10) / 10 : 0;
        if (m.count > 0) { m.catAvgs = {}; CATEGORIES.forEach(cat => m.catAvgs[cat.id] = Math.round(m.catSums[cat.id] / m.count * 10) / 10); }
        return m;
      });
      list.sort((a, b) => b.avg - a.avg);
      let rank = 1;
      list.forEach((item, i) => {
        if (i > 0 && item.avg < list[i - 1].avg) rank = i + 1;
        item.rank = item.count > 0 ? rank : null;
      });
      return list;
    }

      </td>
      ${CATEGORIES.map(cat => `<td style="padding:10px 8px;font-weight:800;color:${r.scores?.[cat.id] >= cat.max * 0.85 ? '#059669' : '#334155'};">${r.scores?.[cat.id] ?? '-'}</td>`).join('')}
      <td style="padding:12px 14px;text-align:left;color:#64748b;font-style:italic;max-width:200px;font-size:12px;" title="${(r.comment || '').replace(/"/g, '&quot;')}">
        ${r.comment ? `"${r.comment}"` : '<span style="color:#cbd5e1;">-</span>'}
      </td>
    </tr>
  `).join('');

      const judgeCards = records.map(r => {
        const rowTotal = r.total || 0;
        const pct = Math.min(100, rowTotal);
        return `
    <div style="background:#fff;border:1.5px solid #e0e7ff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(99,102,241,.06);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:0 4px 12px rgba(79,70,229,.3);">🧑‍⚖️</div>
          <div>
            <div style="font-size:16px;font-weight:900;color:#1e293b;">${r.judge}</div>
            ${r.savedAt ? '<div style="font-size:11px;color:#94a3b8;">🕒 ' + new Date(r.savedAt).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }) + ' น.</div>' : ''}
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:28px;font-weight:900;color:#4f46e5;line-height:1;">${rowTotal}</div>
          <div style="font-size:11px;color:#94a3b8;font-weight:600;">/ 100 คะแนน</div>
        </div>
      </div>
      <div style="background:#e0e7ff;border-radius:99px;height:6px;overflow:hidden;margin-bottom:16px;">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#4f46e5,#7c3aed);border-radius:99px;transition:width .5s;"></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
        ${CATEGORIES.map(cat => {
          const v = r.scores?.[cat.id] ?? 0;
          const p = Math.min(100, (v / cat.max) * 100);
          return '<div style="background:' + cat.bg + ';border:1px solid ' + cat.border + ';border-radius:12px;padding:10px;text-align:center;">'
            + '<div style="font-size:10px;color:' + cat.color + ';font-weight:700;margin-bottom:4px;line-height:1.3;">' + cat.title + '</div>'
            + '<div style="font-size:18px;font-weight:900;color:' + cat.color + ';">' + v + ' <span style="font-size:10px;color:#94a3b8;font-weight:400;">/' + cat.max + '</span></div>'
            + '<div style="background:rgba(0,0,0,.06);border-radius:99px;height:4px;margin-top:6px;overflow:hidden;">'
            + '<div style="height:100%;width:' + p + '%;background:' + cat.bar + ';border-radius:99px;"></div>'
            + '</div>'
            + '</div>';
        }).join('')}
      </div>
      ${r.comment ? '<div style="margin-top:14px;padding:12px 16px;background:#f8faff;border-left:4px solid #6366f1;border-radius:0 12px 12px 0;font-size:13px;color:#475569;font-style:italic;">💬 "' + r.comment + '"</div>' : ''}
    </div>`;
      }).join('');

      return `
  <div class="modal-ov" onclick="if(event.target===this)set({selectedTeam:null})">
    <div class="modal-box" style="max-width:850px;width:95%;max-height:92vh;overflow-y:auto;padding:28px;">
      
      <!-- Modal Header -->
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;">
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:900;box-shadow:0 6px 20px rgba(79,70,229,.3);">${teamCode}</div>
          <div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="badge-blue">${cohort ? cohort.name : cohortId}</span>
              <span style="font-size:12px;color:#059669;background:#ecfdf5;border:1px solid #a7f3d0;padding:2px 8px;border-radius:12px;font-weight:700;">✓ ประเมินแล้ว ${records.length} กรรมการ</span>
            </div>
            <h3 style="font-size:24px;font-weight:900;color:#1e293b;margin:4px 0 0 0;">คะแนนแยกตามกรรมการ — ทีม ${teamCode}</h3>
          </div>
        </div>
        <button onclick="set({selectedTeam:null})" style="background:#f1f5f9;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:#64748b;transition:all .2s;" onmouseover="this.style.background='#e2e8f0'" onmouseout="this.style.background='#f1f5f9'">✕</button>
      </div>

      <!-- Average Summary Banner -->
      <div style="background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:20px;padding:20px 26px;margin-bottom:24px;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(79,70,229,.25);">
        <div>
          <div style="font-size:13px;opacity:.8;font-weight:600;">คะแนนเฉลี่ยรวมทุกหมวด (จาก ${records.length} กรรมการ)</div>
          <div style="font-size:44px;font-weight:900;line-height:1;margin-top:4px;">${avg} <span style="font-size:18px;opacity:.65;font-weight:400;">/ 100 คะแนน</span></div>
        </div>
        <div style="text-align:right;">
          <div style="background:rgba(255,255,255,.2);backdrop-filter:blur(10px);border-radius:14px;padding:10px 20px;font-size:14px;font-weight:800;border:1px solid rgba(255,255,255,.3);">
            🧑‍⚖️ ลงคะแนนแล้ว ${records.length} คน
          </div>
        </div>
      </div>

      <!-- Table 1: Comparison Matrix -->
      <div style="margin-bottom:24px;background:#fff;border:1.5px solid #e2e8f0;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.04);">
        <div style="padding:14px 20px;background:linear-gradient(135deg,#f8faff,#eef2ff);border-bottom:1px solid #e2e8f0;font-weight:800;font-size:14px;color:#312e81;display:flex;align-items:center;gap:8px;">
          <span style="font-size:16px;">📊</span> ตารางเปรียบเทียบคะแนนรายกรรมการ (Side-by-Side Comparison)
        </div>
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;text-align:center;">
            <thead>
              <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;color:#64748b;font-size:11px;font-weight:700;">
                <th style="padding:12px;text-align:left;">กรรมการ</th>
                <th style="padding:12px;color:#4f46e5;font-weight:900;background:#f5f3ff;">รวม/100</th>
                ${CATEGORIES.map(c => `<th style="padding:12px 8px;">${c.title.length > 12 ? c.title.slice(0, 12) + '…' : c.title}<br><span style="color:#94a3b8;font-weight:400;">(${c.max})</span></th>`).join('')}
                <th style="padding:12px;text-align:left;">ความคิดเห็น</th>
              </tr>
            </thead>
            <tbody>
              ${judgeTableRows}
              <tr style="background:#eef2ff;font-weight:900;border-top:2.5px solid #c7d2fe;color:#312e81;">
                <td style="padding:12px 14px;text-align:left;font-weight:900;">⭐ คะแนนเฉลี่ย (${records.length} คน)</td>
                <td style="padding:12px;font-size:18px;color:#4338ca;background:#e0e7ff;">${avg}</td>
                ${CATEGORIES.map(cat => `<td style="padding:12px 8px;color:#4338ca;font-size:14px;">${catAvgRow[cat.id]}</td>`).join('')}
                <td style="padding:12px 14px;text-align:left;font-size:12px;color:#6366f1;">-</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Section 2: Cards per judge -->
      <div>
        <div style="font-size:15px;font-weight:800;color:#1e293b;margin-bottom:14px;display:flex;align-items:center;gap:8px;">
          <span>⚖️</span> รายละเอียดคะแนนแต่ละหมวดของกรรมการแต่ละคน (${records.length} คน)
        </div>
        ${judgeCards}
      </div>

    </div>
  </div>`;
    }


    // ========================== MODAL ==========================
    function renderModal() {
      if (!S.showModal) return '';
      const cohort = COHORTS.find(c => c.id === S.cohortId);
      const tot = total(S.scores);
      const r = tot >= 90 ? { l: 'ดีเยี่ยม ⭐', bg: '#fffbeb', c: '#d97706', bc: '#fde68a' }
        : tot >= 80 ? { l: 'ดีมาก ✅', bg: '#ecfdf5', c: '#059669', bc: '#a7f3d0' }
          : tot >= 70 ? { l: 'ดี 👍', bg: '#eff6ff', c: '#2563eb', bc: '#bfdbfe' }
            : { l: 'ผ่านเกณฑ์', bg: '#f8fafc', c: '#64748b', bc: '#e2e8f0' };
      return `
  <div class="modal-ov" onclick="if(event.target===this)set({showModal:false})">
    <div class="modal-box confirm-modal-box">
      <!-- Header -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="font-size:17px;font-weight:900;color:#1e293b;margin:0;">🛡️ สรุปก่อนยืนยันบันทึก</h3>
        <button onclick="set({showModal:false})" style="background:#f1f5f9;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:#64748b;" title="ปิดหน้าต่าง">✕</button>
      </div>

      <!-- Info badge -->
      <div style="background:#f8faff;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:12px;display:flex;flex-wrap:wrap;gap:10px;border:1px solid #e0e7ff;">
        <div><span style="color:#64748b;">กรรมการ:</span> <strong style="color:#4338ca;">${S.judgeName}</strong></div>
        <div><span style="color:#64748b;">รุ่น:</span> <strong style="color:#1e293b;">${cohort.name}</strong></div>
        <div><span style="color:#64748b;">ทีม:</span> <strong style="color:#d97706;">${S.teamCode}</strong></div>
      </div>

      <!-- Total score card -->
      <div class="confirm-total-banner" style="background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:14px;padding:12px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;color:#fff;box-shadow:0 4px 16px rgba(79,70,229,.25);">
        <div>
          <div style="font-size:11px;opacity:.8;">คะแนนรวมสุทธิ</div>
          <div class="confirm-total-score" style="font-size:36px;font-weight:900;line-height:1;margin-top:2px;">${tot} <span style="font-size:14px;opacity:.7;font-weight:400;">/100</span></div>
        </div>
        <div style="background:${r.bg};color:${r.c};border:1px solid ${r.bc};padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;">${r.l}</div>
      </div>

      <!-- Category summary list -->
      <div class="confirm-cat-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:210px;overflow-y:auto;padding-right:2px;">
        ${CATEGORIES.map(cat => {
        const val = S.scores[cat.id] ?? 0;
        const pct = (parseFloat(val) || 0) / cat.max * 100;
        return `<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:${cat.bg};border-radius:10px;border:1px solid ${cat.border};">
            <div style="width:7px;height:7px;border-radius:50%;background:${cat.bar};flex-shrink:0;"></div>
            <div style="flex:1;font-size:12px;color:#1e293b;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${cat.title}</div>
            <div style="width:55px;background:#f1f5f9;border-radius:4px;height:4px;overflow:hidden;flex-shrink:0;">
              <div style="height:100%;width:${pct}%;background:${cat.bar};border-radius:4px;"></div>
            </div>
            <div style="font-size:12px;font-weight:800;color:${cat.color};min-width:44px;text-align:right;flex-shrink:0;">${val} <span style="color:#94a3b8;font-weight:400;font-size:10px;">/${cat.max}</span></div>
          </div>`;
      }).join('')}
      </div>

      ${S.comment ? `<div style="background:#f8faff;border:1px solid #e0e7ff;padding:8px 12px;border-radius:10px;margin-bottom:10px;font-size:11px;color:#64748b;font-style:italic;">"${S.comment}"</div>` : ''}

      <!-- Sticky Action Footer -->
      <div style="position:sticky;bottom:-16px;background:#fff;padding-top:10px;padding-bottom:4px;border-top:1px solid #f1f5f9;display:flex;gap:8px;justify-content:flex-end;margin-top:auto;z-index:20;">
        <button class="btn btn-outline" style="padding:10px 14px;font-size:13px;" onclick="set({showModal:false})">← แก้ไข</button>
        <button class="btn btn-green" style="padding:12px 18px;font-size:14px;flex:1;justify-content:center;box-shadow:0 4px 14px rgba(5,150,105,.35);" onclick="confirmSave()">✓ ยืนยันบันทึกคะแนน</button>
      </div>
    </div>
  </div>`;
    }

    // ========================== EVENTS ==========================
    window.openTeamDetail = (cohortId, teamCode) => { set({ selectedTeam: { cohortId, teamCode } }); };
    window.enterJudge = () => { const ex = loadScore(S.cohortId, S.teamCode, S.judgeName); set({ screen: 'judge', scores: ex?.scores || {}, comment: ex?.comment || '', errors: {} }); };
    window.enterAdmin = () => { if (S.loginPass === ADMIN_PASS) set({ screen: 'admin', loginPass: '', loginPassErr: false }); else set({ loginPassErr: true }); };
    window.logout = () => set({ screen: 'login', loginMode: '', loginPass: '', loginPassErr: false, scores: {}, comment: '', errors: {}, showModal: false });
    window.selectCohort = (id, t) => { const ex = loadScore(id, t, S.judgeName); set({ cohortId: id, teamCode: t, scores: ex?.scores || {}, comment: ex?.comment || '', errors: {}, showModal: false }); };
    window.selectTeam = t => { const ex = loadScore(S.cohortId, t, S.judgeName); set({ teamCode: t, scores: ex?.scores || {}, comment: ex?.comment || '', errors: {}, showModal: false }); };

    window.fillSample = () => {
      const sc = {};
      CATEGORIES.forEach(cat => {
        const ratio = 0.72 + Math.random() * 0.2;
        sc[cat.id] = Math.round(ratio * cat.max * 10) / 10;
      });
      S.scores = sc; S.errors = {};
      render();
      // update bars & total display
      const tot = total(sc);
      const ts = document.getElementById('total_score');
      const tb = document.getElementById('total_bar');
      if (ts) ts.textContent = tot;
      if (tb) tb.style.width = tot + '%';
    };

    window.onInp = (id, val, max, color) => {
      const num = parseFloat(val);
      const over = val !== '' && !isNaN(num) && num > parseFloat(max);
      const inp = document.getElementById('inp_' + id);
      const bar = document.getElementById('bar_' + id);
      const errEl = document.getElementById('err_' + id);
      if (inp) { inp.style.borderColor = over ? '#ef4444' : val !== '' ? color : ''; inp.style.boxShadow = over ? '0 0 0 4px rgba(239,68,68,.1)' : val !== '' ? '0 0 0 4px ' + color + '25' : ''; }
      if (bar) { const pct = (!over && val !== '' && !isNaN(num)) ? Math.min(100, (num / parseFloat(max)) * 100) : 0; bar.style.width = pct + '%'; }
      if (errEl) { errEl.style.display = over ? 'flex' : 'none'; }
      S.scores = { ...S.scores, [id]: val };
      const tot = total(S.scores);
      const ts = document.getElementById('total_score');
      const tb = document.getElementById('total_bar');
      if (ts) ts.textContent = tot;
      if (tb) tb.style.width = tot + '%';
    };

    window.openModal = () => {
      const newErrors = {}; let hasErr = false;
      CATEGORIES.forEach(cat => {
        const v = S.scores[cat.id];
        if (v === '' || v === undefined || v === null) { newErrors[cat.id] = `โปรดกรอกคะแนน (0–${cat.max})`; hasErr = true; }
        else {
          const n = Number(v);
          if (isNaN(n) || n < 0) { newErrors[cat.id] = 'คะแนนต้องเป็นตัวเลขที่ไม่ติดลบ'; hasErr = true; }
          else if (n > cat.max) { newErrors[cat.id] = `เกินคะแนนเต็ม (สูงสุด ${cat.max})`; hasErr = true; }
        }
      });
      if (hasErr) {
        set({ errors: newErrors });
        showToast('⚠️ กรุณากรอกคะแนนให้ครบถ้วนและถูกต้องทุกหมวด (6 หมวด)', 4000);
        setTimeout(() => {
          const firstErr = document.querySelector('.err-card');
          if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
        return;
      }
      set({ errors: {}, showModal: true });
    };

    window.confirmSave = () => {
      try {
        const tot = total(S.scores);
        saveRec({ cohortId: S.cohortId, teamCode: S.teamCode, judge: S.judgeName, scores: S.scores, total: tot, comment: S.comment });
        set({ showModal: false });
        showToast(`✅ บันทึกคะแนนทีม ${S.teamCode} สำเร็จ! (${tot} คะแนน)`, 4000);
      } catch (e) {
        console.error("Error confirming save:", e);
        showToast(`❌ เกิดข้อผิดพลาดในการบันทึก: ${e.message}`, 5000);
      }
    };

    window.resetForm = () => set({ scores: {}, comment: '', errors: {} });

    window.exportCSV = () => {
      const all = getAll();
      if (!all.length) { alert('ยังไม่มีข้อมูล'); return; }
      const hd = ['รุ่น', 'ทีม', 'กรรมการ', ...CATEGORIES.map(c => c.title + ' (' + c.max + ')'), 'รวม', 'ความคิดเห็น', 'วันที่'];
      const rows = all.map(r => {
        const cName = COHORTS.find(c => c.id === r.cohortId)?.name || r.cohortId;
        const dt = r.savedAt ? new Date(r.savedAt).toLocaleString('th-TH') : '-';
        return [`"${cName}"`, `"${r.teamCode}"`, `"${r.judge}"`, ...CATEGORIES.map(cat => r.scores?.[cat.id] || 0), r.total || 0, `"${(r.comment || '').replace(/"/g, '""')}"`, `"${dt}"`];
      });
      const csv = '\uFEFF' + [hd.join(','), ...rows.map(r => r.join(','))].join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      a.download = `scoring_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
    };

    window.seedDemo = () => {
      if (!confirm('โหลดข้อมูลจำลอง? (จะเพิ่มข้อมูลเข้าสู่ Firebase สำหรับทุกเครื่อง)')) return;
      clearAll();
      const judges = ['กรรมการ 1', 'กรรมการ 2', 'กรรมการ 3'];
      const cmts = ['Dashboard สวยงาม เลือกสีน่าสนใจมาก', 'การวิเคราะห์เชิงลึกดีมาก ตอบโจทย์งาน', 'ควรปรับ Storytelling ให้กระชับยิ่งขึ้น', 'ใช้ DAX ได้ยอดเยี่ยม Data Model ดีมาก', 'ไอเดียดีมาก มีความเป็นไปได้ในองค์กรสูง'];
      const recsObj = {};
      const recsArr = [];
      COHORTS.forEach(c => c.teams.forEach((t, ti) => {
        const jc = Math.floor(Math.random() * 2) + 2;
        for (let j = 0; j < jc; j++) {
          const sc = {}; let tot = 0;
          CATEGORIES.forEach(cat => {
            const ratio = Math.min(Math.max(.65 + Math.sin(ti * 1.5 + j) * .15 + Math.random() * .1, 0.6), 1.0);
            const s = Math.round(ratio * cat.max * 10) / 10; sc[cat.id] = Math.min(s, cat.max); tot += sc[cat.id];
          });
          tot = Math.round(tot * 10) / 10;
          const rawId = `${c.id}__${t}__${judges[j]}`;
          const fbKey = sanitizeFirebaseKey(rawId);
          const rec = { id: rawId, fbKey, cohortId: c.id, teamCode: t, judge: judges[j], scores: sc, total: tot, comment: cmts[Math.floor(Math.random() * cmts.length)], savedAt: new Date(Date.now() - Math.random() * 86400000 * 2).toISOString() };
          recsObj[fbKey] = rec;
          recsArr.push(rec);
        }
      }));
      if (db) {
        try {
          db.ref("evaluations").set(recsObj);
        } catch (e) { console.error(e); }
      } else {
        localStorage.setItem(SK, JSON.stringify(recsArr));
        set({});
      }
      showToast(`โหลดข้อมูลจำลองเข้าสู่ Firebase เรียบร้อย`);
    };

    // ========================== RENDER ==========================
    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;
      appEl.innerHTML =
        S.screen === 'login' ? renderLogin() :
          S.screen === 'judge' ? renderJudge() :
            renderAdmin();
    }

    render();
    window.addEventListener('DOMContentLoaded', render);
    window.addEventListener('load', render);
  </script>
</body>

</html>
